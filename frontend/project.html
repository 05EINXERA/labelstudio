<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project - Dataset Workspace</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="styles.css?v=7">
  <link rel="modulepreload" href="js/pages/project/router.js?v=4">
  <link rel="modulepreload" href="js/pages/project/home.js?v=2">
  <script>
    if (!localStorage.getItem('logged_in')) {
      window.location.replace('/');
    }
    window.addEventListener('pageshow', function () {
      if (!localStorage.getItem('logged_in')) {
        window.location.replace('/');
      }
    });
  </script>
</head>

<body style="background: var(--bg);">

  <header class="mgmt-header">
    <div class="brand">
      <a href="projects.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;">
        <img src="logo.png" alt="Logo">
      </a>
      <div>
        <p class="mgmt-eyebrow" style="margin: 0;">
          <a href="projects.html" style="color: var(--muted); text-decoration: none;">Projects</a> /
        </p>
        <h1 id="projectName">Loading…</h1>
      </div>
      <span class="pill" id="projectStatus" style="margin-left: 8px;"></span>
    </div>
    <nav style="display: flex; gap: 20px; margin-left: 30px; align-items: center;">
      <a href="projects.html" style="color: var(--muted); text-decoration: none; font-weight: 500;">Projects</a>
      <a href="teams.html" style="color: var(--muted); text-decoration: none; font-weight: 500;">Teams</a>
    </nav>
    <div class="spacer"></div>
    <span class="mgmt-user" id="currentUser"></span>
    <div class="notification-wrap">
      <button class="tool-button notification-bell" id="notifBell" type="button"
        aria-label="Notifications" aria-expanded="false" aria-haspopup="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
        <span class="notification-badge" id="notifBadge">0</span>
      </button>
      <div class="notification-dropdown" id="notifDropdown" role="menu">
        <div class="notification-list" id="notifList"></div>
      </div>
    </div>
    <button class="primary" id="annotateBtn" type="button"
      style="padding: 9px 16px; border-radius: 8px; font-weight: 600;">Annotate</button>
    <button class="tool-button" id="logoutBtn" type="button">Log out</button>
  </header>

  <div class="project-shell">
    <nav class="project-nav" id="projectNav" aria-label="Project sections">
      <p class="nav-section">Project</p>
      <!-- Links injected by project-nav.js -->
    </nav>

    <main class="project-view" id="projectView" aria-live="polite">
      <div class="mgmt-empty">Loading…</div>
    </main>
  </div>

  <script type="module" src="js/pages/project/router.js?v=4"></script>
</body>

</html>
