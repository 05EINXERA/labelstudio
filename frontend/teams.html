<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams - Dataset Workspace</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="styles.css?v=3">
</head>

<body style="background: var(--bg);">

  <header class="mgmt-header">
    <div class="brand">
      <img src="logo.png" alt="Logo">
      <h1>Teams</h1>
    </div>
    <nav style="display: flex; gap: 20px; margin-left: 30px;">
      <a href="projects.html" style="color: var(--muted); text-decoration: none; font-weight: 500;">Projects</a>
      <a href="teams.html" style="color: var(--ink); text-decoration: none; font-weight: 600;">Teams</a>
    </nav>
    <div class="spacer"></div>
    <span class="mgmt-user" id="currentUser"></span>
    <button class="tool-button" id="logoutBtn" type="button">Log out</button>
  </header>

  <main class="mgmt-main">
    <div class="mgmt-title-row">
      <div>
        <p class="mgmt-eyebrow">Workspace</p>
        <h2>Manage Teams</h2>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="primary" id="newTeamBtn" type="button"
          style="padding: 10px 18px; border-radius: 8px; font-weight: 600;">+ New Team</button>
        <button class="primary" id="newMemberBtn" type="button"
          style="padding: 10px 18px; border-radius: 8px; font-weight: 600;">+ New Member</button>
      </div>
    </div>

    <div id="errorBanner" class="mgmt-error" style="display: none;"></div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px;">
      <!-- Teams List -->
      <div style="background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px;">
        <h3 style="margin-bottom: 16px; font-size: 1.1rem; color: var(--ink);">Teams</h3>
        <div id="teamsMount"></div>
      </div>

      <!-- Members List -->
      <div style="background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px;">
        <h3 style="margin-bottom: 16px; font-size: 1.1rem; color: var(--ink);">Team Members</h3>
        <div id="membersMount"></div>
      </div>
    </div>
  </main>

  <!-- New Team modal -->
  <div class="modal-overlay" id="teamModal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h2 id="teamModalTitle">New Team</h2>
        <button class="modal-close" id="teamModalClose" type="button">&times;</button>
      </div>
      <div id="teamModalError" style="display: none; padding: 10px 16px; background: #ffebee; color: #c62828; font-size: 0.9rem; border-bottom: 1px solid #ffcdd2;"></div>
      <form id="teamForm">
        <div class="modal-body" style="display: grid; gap: 14px;">
          <label style="display: grid; gap: 6px;">
            <span style="font-size: .85rem; color: var(--muted);">Team Name</span>
            <input type="text" id="teamFormName" required
              style="padding: 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);">
          </label>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end; padding: 16px;">
          <button type="button" class="tool-button" id="teamFormCancel">Cancel</button>
          <button type="submit" class="primary" style="padding: 9px 18px; border-radius: 6px;">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Assign Team Member modal -->
  <div class="modal-overlay" id="assignModal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h2 id="assignModalTitle">Assign Team</h2>
        <button class="modal-close" id="assignModalClose" type="button">&times;</button>
      </div>
      <div id="assignModalError" style="display: none; padding: 10px 16px; background: #ffebee; color: #c62828; font-size: 0.9rem; border-bottom: 1px solid #ffcdd2;"></div>
      <form id="assignForm">
        <input type="hidden" id="assignFormName">
        <div class="modal-body" style="display: grid; gap: 14px;">
          <p style="font-size: .9rem; color: var(--muted);">Assign <strong id="assignMemberName" style="color: var(--ink);"></strong> to a team.</p>
          <label style="display: grid; gap: 6px;">
            <span style="font-size: .85rem; color: var(--muted);">Teams</span>
            <div id="assignFormTeams" style="display: grid; gap: 8px; max-height: 150px; overflow-y: auto; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);">
            </div>
          </label>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end; padding: 16px;">
          <button type="button" class="tool-button" id="assignFormCancel">Cancel</button>
          <button type="submit" class="primary" style="padding: 9px 18px; border-radius: 6px;">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- New Member modal -->
  <div class="modal-overlay" id="newMemberModal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h2 id="newMemberModalTitle">New Member</h2>
        <button class="modal-close" id="newMemberModalClose" type="button">&times;</button>
      </div>
      <div id="newMemberModalError" style="display: none; padding: 10px 16px; background: #ffebee; color: #c62828; font-size: 0.9rem; border-bottom: 1px solid #ffcdd2;"></div>
      <form id="newMemberForm">
        <div class="modal-body" style="display: grid; gap: 14px;">
          <label style="display: grid; gap: 6px;">
            <span style="font-size: .85rem; color: var(--muted);">Member Name</span>
            <input type="text" id="newMemberFormName" required
              style="padding: 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);">
          </label>
          <label style="display: grid; gap: 6px;">
            <span style="font-size: .85rem; color: var(--muted);">Teams (Optional)</span>
            <div id="newMemberFormTeams" style="display: grid; gap: 8px; max-height: 150px; overflow-y: auto; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);">
            </div>
          </label>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end; padding: 16px;">
          <button type="button" class="tool-button" id="newMemberFormCancel">Cancel</button>
          <button type="submit" class="primary" style="padding: 9px 18px; border-radius: 6px;">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/pages/teams.js?v=1"></script>
</body>

</html>
