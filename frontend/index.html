<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dataset Workspace</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="login.css?v=3">
  <script>
    if (localStorage.getItem('logged_in') === 'true') {
      window.location.replace('projects.html');
    }
    window.addEventListener('pageshow', function () {
      if (localStorage.getItem('logged_in') === 'true') {
        window.location.replace('projects.html');
      }
    });
  </script>
</head>

<body>
  <div class="login-container">
    <div class="brand-header">
      <img src="logo.png" alt="Dataset Workspace Logo">
      <h1>Image Annotation</h1>
      <p>Sign in to access your annotation tools</p>
    </div>

    <form class="login-form" id="loginForm">
      <div id="error-message" style="color: var(--danger); text-align: center; margin-bottom: 1rem; display: none;"></div>
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required
          autocomplete="username">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter your password" required
            autocomplete="current-password">
          <button type="button" id="togglePasswordBtn" class="toggle-password-btn" aria-label="Show password" title="Show password" tabindex="0">
            <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg id="eyeOffIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-text" id="btnText">Sign In</span>
        <div class="spinner"></div>
      </button>

      <div id="registerLinkContainer" style="text-align: center; margin-top: 1rem; display: none;">
        <a href="#" id="toggleMode" style="color: var(--accent); text-decoration: none; font-size: 0.9rem;">Need an account? Register</a>
      </div>
    </form>
  </div>

  <script>
    let isLoginMode = true;
    const toggleModeBtn = document.getElementById('toggleMode');
    const btnText = document.getElementById('btnText');
    const headerText = document.querySelector('.brand-header p');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');

    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeIcon.style.display = isPassword ? 'none' : 'block';
        eyeOffIcon.style.display = isPassword ? 'block' : 'none';
        togglePasswordBtn.title = isPassword ? 'Hide password' : 'Show password';
        togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });
    }

    toggleModeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      isLoginMode = !isLoginMode;
      if (isLoginMode) {
        btnText.textContent = 'Sign In';
        headerText.textContent = 'Sign in to access your annotation tools';
        toggleModeBtn.textContent = 'Need an account? Register';
      } else {
        btnText.textContent = 'Register';
        headerText.textContent = 'Create an account to start annotating';
        toggleModeBtn.textContent = 'Already have an account? Sign In';
      }
    });

    // Check if registration is enabled
    fetch('/api/auth/config')
      .then(res => res.json())
      .then(data => {
        if (data.allow_registration) {
          document.getElementById('registerLinkContainer').style.display = 'block';
        }
      })
      .catch(err => console.error('Failed to fetch auth config:', err));

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('error-message');
      btn.classList.add('is-loading');
      btn.disabled = true;
      errorMsg.style.display = 'none';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        if (!isLoginMode) {
          // Register
          const regRes = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          if (!regRes.ok) {
            const data = await regRes.json();
            throw new Error(data.detail || 'Registration failed');
          }
          // Fall through to auto-login (or could use the returned token directly)
        }

        // Login
        const formData = new URLSearchParams();
        formData.append('username', username);
        formData.append('password', password);

        const loginRes = await fetch('/api/auth/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData
        });

        if (!loginRes.ok) {
           const data = await loginRes.json();
           throw new Error(data.detail || 'Login failed');
        }

        const data = await loginRes.json();
        
        localStorage.setItem('dataset_username', username);
        localStorage.setItem('logged_in', 'true');
        if (data.access_token) {
          localStorage.setItem('access_token', data.access_token);
        }
        localStorage.removeItem('image-annotation-mvp-v1');
        
        // Land on the projects list, replacing login in the history stack
        window.location.replace('projects.html');
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        btn.classList.remove('is-loading');
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
